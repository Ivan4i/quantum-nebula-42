<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badges & Tags - Quantum Nebula Design System</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      padding: 48px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 48px;
    }

    .header h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .header p {
      font-size: 18px;
      color: var(--text-secondary);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text-primary);
    }

    .section {
      margin-bottom: 64px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--text-primary);
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
    }

    .showcase-item {
      padding: 32px;
      background: var(--bg-surface2);
      border-radius: 24px;
      border: 1.5px solid var(--stroke-stroke2);
    }

    .showcase-item h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .showcase-content {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-link">← Back to Home</a>

  <div class="header">
    <h1>Badges & Tags</h1>
    <p>Status indicators, trend badges, and tags</p>
  </div>

  <div class="section">
    <h2 class="section-title">Trend Badges</h2>
    <div class="showcase-grid">
      <div class="showcase-item">
        <h3>Trend Up</h3>
        <div class="showcase-content">
          <span class="badge badge-trend-up">
            <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
              <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
            +12.5%
          </span>
          <span class="badge badge-trend-up">
            <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
              <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
            +8.2%
          </span>
        </div>
      </div>

      <div class="showcase-item">
        <h3>Trend Down</h3>
        <div class="showcase-content">
          <span class="badge badge-trend-down">
            <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline>
              <polyline points="17 18 23 18 23 12"></polyline>
            </svg>
            -5.3%
          </span>
          <span class="badge badge-trend-down">
            <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline>
              <polyline points="17 18 23 18 23 12"></polyline>
            </svg>
            -2.1%
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Status Badges</h2>
    <div class="showcase-grid">
      <div class="showcase-item">
        <h3>Status Types</h3>
        <div class="showcase-content">
          <span class="badge-status badge-new">New</span>
          <span class="badge-status badge-hot">Hot</span>
        </div>
      </div>

      <div class="showcase-item">
        <h3>Price Badge</h3>
        <div class="showcase-content">
          <span class="badge-price">$299</span>
          <span class="badge-price">$49.99</span>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Indicators</h2>
    <div class="showcase-grid">
      <div class="showcase-item">
        <h3>Unread Indicator</h3>
        <div class="showcase-content">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span>New message</span>
            <div class="unread-indicator"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
